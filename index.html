  const disponiveis = incentivos[faixa].filter(frase => !frasesUsadas.has(frase));
  const conjunto = disponiveis.length ? disponiveis : incentivos[faixa];
  const frase = conjunto[Math.floor(Math.random() * conjunto.length)];
  frasesUsadas.add(frase);
  return frase;

const EAQ_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycby4q4OIkjCG1P7dSMgSNMZ2b_Q_hYUYah3lubdS2fwYTKLKWNfGYQVlQ_nIIcaC3onQ/exec';
// Esta versão faz uma tentativa de envio somente após o aluno terminar.
// Confirmação acontece APENAS depois de consultar o ID na planilha.
let participacaoId='';
let envioEmAndamento=false;
const pausa=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function statusRegistro(texto){const el=layer.querySelector('#registro-status');if(el)el.textContent=texto}
function eaqStatus(id){return new Promise(resolve=>{
 if(!EAQ_WEBAPP_URL)return resolve(null);
 const key='eaqCb'+Date.now()+'_'+Math.floor(Math.random()*100000);
 const sc=document.createElement('script');let finished=false;
 const finish=x=>{if(finished)return;finished=true;clearTimeout(timeout);try{delete window[key]}catch(_){}sc.remove();resolve(x)};
 const timeout=setTimeout(()=>finish(null),12000);
 window[key]=x=>finish(x);sc.onerror=()=>finish(null);
 sc.src=EAQ_WEBAPP_URL+'?acao=status&id='+encodeURIComponent(id)+'&callback='+encodeURIComponent(key)+'&nonce='+Date.now();document.head.appendChild(sc);
})}
function novoID(){return 'EAQ-'+(window.crypto?.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2,12))}
// Formulario tradicional em iframe: evita depender do fetch no-cors no Safari/iPhone.
// O retorno do POST nao e lido (origens diferentes); o registro e confirmado por consulta do ID.

async function eaqPostFormulario(id, dados) {
  try {
    const corpo = new URLSearchParams();

    corpo.set('id', id);
    corpo.set('payload', JSON.stringify(dados));

    await fetch(EAQ_WEBAPP_URL, {
      method: 'POST',
      mode: 'no-cors',
      credentials: 'omit',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
      },
      body: corpo
    });

    return true;
  } catch (erro) {
    console.error('Falha no envio:', erro);
    return false;
  }
}

async function enviarRegistro(){
 if(envioEmAndamento)return;
 if(!EAQ_WEBAPP_URL){statusRegistro('⚠️ Conexão ainda não configurada. Baixe o PDF e avise a escola.');return}
 if(!participacaoId)participacaoId=novoID();
 envioEmAndamento=true;
 const retry=layer.querySelector('#reenviar');if(retry)retry.disabled=true;
 try{
   statusRegistro('🔄 Verificando a conexão com a escola...');
   const inicial=await eaqStatus(participacaoId);
   if(!inicial){statusRegistro('⚠️ O navegador não conseguiu consultar a escola. Abra o jogo diretamente no Safari/Chrome, baixe o PDF e tente reenviar.');return}
   if(inicial.modoTeste===true){statusRegistro('🧪 O Apps Script está em modo de teste. Nada foi registrado.');return}
   if(inicial.ok!==true){statusRegistro('⚠️ O serviço da escola informou erro. Avise a orientação.');return}
   if(inicial.recebido===true){statusRegistro('✅ Respostas confirmadas na planilha da escola.');return}

const dados = {
  nome: name,
  turma: turma,
  bimestre: bimestre,
  personagem: hero + 1,
  respostas: ans.slice(),
  notaFinal: Number(nota.replace(',', '.')),
  compromisso: commit
};
   for(let attempt=1;attempt<=3;attempt++){
      statusRegistro('🔄 Enviando participação ('+attempt+'/3). Aguarde a confirmação...');
      await eaqPostFormulario(participacaoId,dados);
      await pausa(1800);
      for(let check=0;check<2;check++){
       const confirmacao=await eaqStatus(participacaoId);
       if(confirmacao?.recebido===true){statusRegistro('✅ Respostas confirmadas na planilha da escola.');return}
       if(confirmacao?.modoTeste===true){statusRegistro('🧪 O serviço está em modo de teste. Nada foi registrado.');return}
       if(check===0)await pausa(1200);
      }
   }
   statusRegistro('⚠️ Registro não confirmado. Baixe o PDF e tente reenviar. Se persistir, avise a orientação.');

  } catch (erro) {
    console.error('Erro na integração:', erro);
    statusRegistro(
      '⚠️ Falha na conexão: ' +
      (erro?.message || String(erro)) +
      '. O registro não foi confirmado.'
    );
  } finally {
    envioEmAndamento = false;
    if (retry) retry.disabled = false;
  }
}


// Exibe uma prévia do MESMO formulário original usado no PDF,
// com os cinco setores preenchidos segundo as médias das dez respostas.
function montarRodaVisual(){
 const canvas=layer.querySelector('#roda-preview-canvas');
 if(!canvas || ans.length!==10)return;
 const ctx=canvas.getContext('2d');
 if(!ctx)return;
 const img=new Image();
 img.onload=()=>{
  const W=595.5,H=842.25;
  canvas.width=1191;canvas.height=1685;
  ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(img,0,0,W,H);
  const scores=topics.map((_,i)=>(ans[i*2]+ans[i*2+1])/2);
  const cx=297.6,cy=590.7,radius=124;
  ctx.save();ctx.fillStyle='rgba(38,166,191,0.35)';
  for(let sector=0;sector<5;sector++){
   const r=scores[sector]/10*radius,angle=-90+sector*72;
   ctx.beginPath();ctx.moveTo(cx,cy);
   for(let j=0;j<=24;j++){
    const a=(angle-36+j*72/24)*Math.PI/180;
    ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));
   }
   ctx.closePath();ctx.fill();
  }
  ctx.restore();
  // Campos do modelo, seguindo as mesmas posições do arquivo PDF.
  ctx.fillStyle='#143b63';ctx.font='11px Arial, sans-serif';
  ctx.fillText(name.slice(0,37),355,H-795);
  ctx.fillText(turma.slice(0,39),355,H-756);
  ctx.fillText(new Date().toLocaleDateString('pt-BR'),355,H-716);
  ctx.fillText(bimestre.slice(0,39),355,H-678);
  ctx.font='12px Arial, sans-serif';ctx.fillText('QUIXADÁ',36,H-702);
  const avg=scores.reduce((a,b)=>a+b,0)/5;
  ctx.fillText(avg.toFixed(1).replace('.',','),304,H-20);
  canvas.setAttribute('aria-label','Roda da Vida preenchida de '+name+', com médias: '+scores.map(n=>n.toFixed(1).replace('.',',')).join('; '));
 };
 img.onerror=()=>{const box=layer.querySelector('#roda-visual-feedback');if(box)box.textContent='Não foi possível exibir a imagem da roda. O PDF continua disponível.';};
 img.src='data:image/jpeg;base64,'+RODA_JPEG_BASE64;
 const open=()=>{
  try{
   const modal=layer.querySelector('#roda-modal');
   if(!modal)return;
   const zoom=modal.querySelector('img');zoom.src=canvas.toDataURL('image/png');
   modal.hidden=false;modal.querySelector('button').focus();
  }catch(e){alert('Não foi possível ampliar a imagem. Você pode baixar o PDF.')}
 };
 canvas.addEventListener('click',open);
 layer.querySelector('#ampliar-roda')?.addEventListener('click',open);
 layer.querySelector('#fechar-roda')?.addEventListener('click',()=>{layer.querySelector('#roda-modal').hidden=true});
 layer.querySelector('#roda-modal')?.addEventListener('click',e=>{if(e.target.id==='roda-modal')e.currentTarget.hidden=true});
 layer.querySelector('#salvar-roda-imagem')?.addEventListener('click',()=>{
  try{
   const a=document.createElement('a');
   a.href=canvas.toDataURL('image/png');
   a.download='Roda_da_Vida_'+name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').slice(0,35)+'.png';
   a.click();
  }catch(e){alert('Não foi possível salvar a imagem. Baixe o PDF como alternativa.')}
 });
}

function render(screen){game.classList.toggle('playing',screen!=='splash'); if(timer){clearTimeout(timer);timer=null}let html='';
if(screen==='splash'){html='<button class="hero-button" id="start" aria-label="Começar minha jornada">Começar minha jornada</button>';layer.innerHTML=html;layer.querySelector('#start').onclick=()=>render('register');return;}
if(screen==='register'){html=`<div class="panel"><span class="label">MEU PASSAPORTE</span><h1>Quem vai explorar as ilhas?</h1><p>Digite suas informações para personalizar sua jornada.</p><label>Nome do aluno</label><input id="name" value="${esc(name)}" maxlength="80" placeholder="Digite seu nome completo" autocomplete="off"><div class="row"><div><label>Turma</label><select id="turma">${['3º ano A','3º ano B','4º ano A','4º ano B','5º ano A','5º ano B'].map(x=>`<option ${x===turma?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Bimestre</label><select id="bimestre">${['1º bimestre','2º bimestre','3º bimestre','4º bimestre'].map(x=>`<option ${x===bimestre?'selected':''}>${x}</option>`).join('')}</select></div></div><p><button class="btn" id="next">Escolher personagem →</button></p></div>`;layer.innerHTML=html;layer.querySelector('#next').onclick=()=>{const nomeDigitado=layer.querySelector('#name').value.trim();if(nomeDigitado.length<2){alert('Digite seu nome para continuar.');layer.querySelector('#name').focus();return;}name=nomeDigitado;turma=layer.querySelector('#turma').value;bimestre=layer.querySelector('#bimestre').value;render('select')};return;}
if(screen==='select'){html=`<div class="panel" style="text-align:center"><span class="label">NOSSO TIME DE EXPLORADORES</span><h2>${first()}, escolha quem vai representar você!</h2><p>Quatro estudantes com a farda da Educação Adventista, exatamente como na arte aprovada.</p><div class="choices">${portraits.map((u,i)=>`<button class="kid ${selected&&hero===i?'sel':''}" data-h="${i}"><img src="${u}" alt="Estudante ${i+1} com a farda escolar"><b>${first()}</b></button>`).join('')}</div><button class="btn" id="next">Conhecer as ilhas →</button></div>`;layer.innerHTML=html;layer.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{hero=+b.dataset.h;selected=true;render('select')});layer.querySelector('#next').onclick=()=>render('map');return;}
if(screen==='map'){let active=Math.min(4,Math.floor(idx/2));html=`<div class="panel"><span class="label">🗺️ MAPA DA JORNADA</span><h2>Cinco ilhas, dez missões!</h2><p>${first()}, você está explorando o mundo da aprendizagem.</p><div class="bar"><div style="width:${idx*10}%"></div></div><div class="map">${topics.map((t,i)=>`<div class="island ${active===i?'current':active<i?'locked':''}"><span class="emoji">${t[0]}</span><strong>${t[1]}</strong><small>${active>i?'✓ Concluída':active===i?'● Agora':'Em breve'}</small></div>`).join('')}</div><div style="text-align:center"><button class="btn" id="go">${idx===0?'Começar as missões →':'Continuar minha jornada →'}</button></div></div>`;layer.innerHTML=html;layer.querySelector('#go').onclick=()=>render('question');return;}
if(screen==='question'){let area=topics[Math.floor(idx/2)];html=`<div class="panel"><span class="label">${area[0]} ${area[1].toUpperCase()} · MISSÃO ${idx+1}/10</span><div class="bar"><div style="width:${idx*10}%"></div></div><div class="question-wrap"><div><h2>${qs[idx]}</h2><p>Que nota de 1 a 10 representa sua atitude? Responda com sinceridade.</p></div><img class="portrait" src="${portraits[hero]}" alt="${first()}, seu personagem"></div><div class="nums">${Array.from({length:10},(_,i)=>`<button class="num" data-score="${i+1}">${i+1}</button>`).join('')}</div><div class="small">O objetivo é reconhecer seu progresso, não acertar ou errar.</div></div>`;layer.innerHTML=html;layer.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>{ans.push(Number(b.dataset.score));incentivoAtual=escolherIncentivo(ans.at(-1));render('feedback');timer=setTimeout(()=>{idx++;render(idx===10?'reflect':'question')},1750)});return;}
if(screen==='feedback'){const msg=incentivoAtual;html=`<div class="panel" style="text-align:center;max-width:620px"><span class="label">⭐ MISSÃO ${ans.length} CONCLUÍDA</span><h2>Você avançou, ${first()}!</h2><div class="feedback">${msg}</div><div class="load"></div><p class="small">Próxima pergunta automaticamente...</p></div>`;layer.innerHTML=html;return;}
if(screen==='reflect'){html=`<div class="panel"><span class="label">🌱 MEU COMPROMISSO</span><h2>Qual atitude você deseja melhorar?</h2><p>Escreva uma atitude que deseja colocar em prática no próximo bimestre.</p><textarea rows="4" id="commit" placeholder="Eu me comprometo a..."></textarea><p><button class="btn" id="next">Continuar →</button></p></div>`;layer.innerHTML=html;layer.querySelector('#next').onclick=()=>{commit=layer.querySelector('#commit').value;render('grade')};return;}
if(screen==='grade'){html=`<div class="panel" style="text-align:center"><span class="label">🏅 AUTOAVALIAÇÃO FINAL</span><h2>${first()}, que nota você se dá?</h2><p>Escolha uma das três opções.</p><div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:30px 0">${['0,0','0,5','1,0'].map(x=>`<button class="btn" data-grade="${x}">${x}</button>`).join('')}</div></div>`;layer.innerHTML=html;layer.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>{nota=b.dataset.grade;render('end')});return;}
if(screen==='end'){const scores=topics.map((_,i)=>(ans[i*2]+ans[i*2+1])/2),media=scores.reduce((a,b)=>a+b,0)/5;html=`<div class="panel" style="text-align:center"><span class="label">🏆 JORNADA CONCLUÍDA</span><h1>Parabéns, ${first()}!</h1><p>Você completou suas dez missões! Sua sinceridade e seu compromisso são as maiores conquistas dessa jornada.</p><div class="outcome">${topics.map((t,i)=>`<div>${t[0]}<b>${scores[i].toFixed(1).replace('.',',')}</b>${t[1]}</div>`).join('')}</div><p><b>Média geral:</b> ${media.toFixed(1).replace('.',',')} · <b>Nota final:</b> ${nota}</p><section class="roda-showcase"><h3>🌱 Minha Roda da Vida</h3><p>Veja como ficaram suas respostas nas cinco áreas. Esta é a sua roda preenchida!</p><div class="roda-preview-frame"><canvas id="roda-preview-canvas" role="img" aria-label="Sua Roda da Vida preenchida"></canvas></div><div id="roda-visual-feedback" class="small" aria-live="polite"></div><div class="roda-actions"><button type="button" class="btn" id="ampliar-roda">🔎 Ampliar minha roda</button><button type="button" class="btn" id="salvar-roda-imagem">🖼️ Salvar imagem</button></div><div class="roda-modal" id="roda-modal" hidden><button type="button" class="roda-close" id="fechar-roda">✕ Fechar imagem</button><img alt="Roda da Vida individual preenchida" /></div></section><button class="btn" id="pdf" style="margin:8px">⬇ Baixar minha Roda da Vida (PDF)</button><button class="btn" id="reenviar" style="margin:8px">↻ Tentar enviar novamente</button><button class="btn" id="again" style="margin:8px">Nova participação ↻</button><p class="small" id="registro-status">🔄 Aguardando confirmação da escola. Você pode baixar o PDF normalmente.</p></div>`;layer.innerHTML=html;montarRodaVisual();layer.querySelector('#pdf').onclick=baixarPDF;layer.querySelector('#reenviar').onclick=enviarRegistro;enviarRegistro();layer.querySelector('#again').onclick=()=>{participacaoId='';name='';idx=0;ans=[];commit='';nota='';selected=false;frasesUsadas.clear();incentivoAtual='';render('splash')};return;}
}
render('splash');
</script></body></html>
